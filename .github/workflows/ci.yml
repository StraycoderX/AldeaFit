name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check bundle size
        # The whole point of this app is that it loads instantly on gym wifi.
        # Fail the build if the payload creeps past a quarter of a megabyte.
        run: |
          BYTES=$(find dist/assets -name '*.js' -o -name '*.css' | xargs cat | gzip -9 | wc -c)
          echo "Gzipped JS+CSS: ${BYTES} bytes"
          if [ "$BYTES" -gt 262144 ]; then
            echo "::error::Bundle exceeds the 256 KB gzipped budget (${BYTES} bytes)"
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
