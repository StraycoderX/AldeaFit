name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required by the Pages deployment action.
  pages: write
  id-token: write

# Never run two deploys at once, but let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v6
        id: pages

      - run: npm ci

      # Gate the deploy on the same checks CI runs, so main can never publish
      # something that would have failed review.
      - name: Verify
        run: npm run typecheck && npm run lint && npm run test

      - name: Build
        env:
          # Pages serves a project site from /<repo>/, so the bundle must be
          # built with a matching base path. `configure-pages` resolves it.
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
        run: npm run build

      - name: Stamp the service worker cache version
        # Bump the cache name on every deploy so returning visitors pick up the
        # new build instead of being served an old cached shell.
        run: |
          sed -i "s/aldeafit-v1/aldeafit-${GITHUB_SHA::8}/" dist/sw.js
          grep -m1 CACHE_VERSION dist/sw.js

      - name: Add SPA fallback
        # Pages has no rewrite rules. Routing is hash-based so this is only a
        # safety net for a mistyped path, but it avoids a bare 404 page.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
