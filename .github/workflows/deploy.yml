name: Deploy to GitHub Pages

on:
  push:
    # Both the eventual release branch and the branch this work was developed
    # on, so the first deploy does not wait on a rename.
    branches: [main, claude/aldeafit-multidevice-app-58kkeg]
  workflow_dispatch:

permissions:
  contents: read
  # Required by the Pages deployment action.
  pages: write
  id-token: write

# Never run two deploys at once, but let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # Gate the deploy on the same checks CI runs, so main can never publish
      # something that would have failed review.
      - name: Verify
        run: npm run typecheck && npm run lint && npm run test

      - name: Resolve base path
        id: base
        # A project site is served from /<repo>/, but a custom domain serves
        # from the root. Deriving this from the presence of public/CNAME means
        # adding the domain file is the only change needed to switch over.
        run: |
          if [ -f public/CNAME ]; then
            echo "Custom domain: $(cat public/CNAME) — building for root"
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            RAW='${{ steps.pages.outputs.base_path }}'
            if [ -z "$RAW" ] || [ "$RAW" = "/" ]; then RAW=""; fi
            echo "Project site — building for ${RAW}/"
            echo "path=${RAW}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Stamp the service worker cache version
        # Bump the cache name on every deploy so returning visitors pick up the
        # new build instead of being served an old cached shell.
        run: |
          sed -i "s/aldeafit-v1/aldeafit-${GITHUB_SHA::8}/" dist/sw.js
          grep -m1 CACHE_VERSION dist/sw.js

      - name: Add SPA fallback
        # Pages has no rewrite rules. Routing is hash-based so this is only a
        # safety net for a mistyped path, but it avoids a bare 404 page.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        # Without this, a "deploy from branch" setup would have Jekyll strip
        # `_headers` and anything else beginning with an underscore.
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
